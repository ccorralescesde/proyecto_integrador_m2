<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novamentis - Login</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <section class="container-fluid">
          <span class="navbar-brand fw-bold">Novamentis</span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <section class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Inicio</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="notas.html">Notas</a></li>
            <li class="nav-item"><a class="nav-link" href="registro_estud.html">Registro</a></li>
          </ul>
          </section>
        </section>
      </nav>
    </header>

    <main class="login-container flex-grow-1 d-flex align-items-center py-5">
      <section class="container">
      <section class="row align-items-center">
      <section class="col-12 col-lg-6 mb-4 mb-lg-0">
        <section class="card shadow-sm p-4">
          <h2 class="mb-4 text-center">Iniciar sesión</h2>
        <form action="" method="POST">

          <section class="mb-3">
          <label for="correo" class="form-label">Correo estudiante</label>
          <input
            type="email"
            name="correo"
            id="correo"
            placeholder="Ingrese su correo"
            required class="form-control"
          />
          </section>


          <section class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input class="form-control"
            type="password"
            name="contrasena"
            id="contrasena"
            placeholder="Ingrese su contraseña"
            required
            minlength="6"
          />
          </section>

          <section class="mb-3 form-check">
          <input type="checkbox" name="recordar" id="recordar" class="form-check-input" />
          <label for="recordar" class="form-label">Recordar contraseña</label>
          </section>

          <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar sesión</button>

          <section class="d-flex justify-content-between"> 
          <a href="registro_estud.html" class="text-decoration-none small">Crear cuenta</a>
          <a href="#" class="text-decoration-none small text-secondary">Restablecer contraseña</a>
          </section>
        </form>
        </section>
      </section>

      <section class="col-12 col-lg-6 text-center">
        <img class="img-fluid rounded" src="img/login.png" alt="Portal de estudiantes Novamentis" />
      
      </section>
      </section>
    </main>

    <footer class="footer py-3 bg-dark text-white flexed">
      <section class="container text-center">
      <p class="mb-1">&copy; 2026 Novamentis. Todos los derechos reservados.</p>
      <p class="mb-0">Desarrollado por EAM 2026</p>
      </section>
    </footer>

  </body>
</html>
