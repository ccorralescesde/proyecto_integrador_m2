<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novamentis - Login</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>

    <header>
      <nav class="navbar">
        <span class="title">Novamentis</span>
        <ul class="nav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="notas.html">Notas</a></li>
          <li><a href="registro_estud.html">Registro</a></li>
        </ul>
      </nav>
    </header>

    <main class="login-container">

      <section class="form-login">
        <form action="" method="POST">

          <label for="correo">Correo estudiante</label>
          <input type="email" name="correo" id="correo"
                 placeholder="Ingrese su correo" required>

          <label for="contrasena">Contraseña</label>
          <input type="password" name="contrasena" id="contrasena"
                 placeholder="Ingrese su contraseña" required minlength="6">

          <input type="checkbox" name="recordar" id="recordar">
          <label for="recordar">Recordar contraseña</label>

          <button type="submit" class="btn-login">Iniciar sesión</button>

          <a href="registro_estud.html">Crear cuenta</a>
          <a href="#">Restablecer contraseña</a>

        </form>
      </section>

      <section class="img-login">
        <img src="img/login.png" alt="Portal de estudiantes Novamentis">
      </section>

    </main>

    <footer class="footer">
      <p>&copy; 2026 Novamentis. Todos los derechos reservados.</p>
      <p>Desarrollado por EAM 2026</p>
    </footer>

  </body>
</html>
