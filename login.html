<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novamentis - Login</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow"">
        <section class="container-fluid">
          <span class="navbar-brand fw-bold">Novamentis</span>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <section class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Inicio</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="notas.html">Notas</a></li>
            <li class="nav-item"><a class="nav-link" href="registro_estud.html">Registro</a></li>
          </ul>
          </section>
        </section>
      </nav>
    </header>

    <main class="login-container">
      <section class="form-login">
        <form action="" method="POST">
          <label for="correo">Correo estudiante</label>
          <input
            type="email"
            name="correo"
            id="correo"
            placeholder="Ingrese su correo"
            required
          />

          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            name="contrasena"
            id="contrasena"
            placeholder="Ingrese su contraseña"
            required
            minlength="6"
          />

          <input type="checkbox" name="recordar" id="recordar" />
          <label for="recordar">Recordar contraseña</label>

          <button type="submit" class="btn-login">Iniciar sesión</button>

          <a href="registro_estud.html">Crear cuenta</a>
          <a href="#">Restablecer contraseña</a>
        </form>
      </section>

      <section class="img-login">
        <img src="img/login.png" alt="Portal de estudiantes Novamentis" />
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Novamentis. Todos los derechos reservados.</p>
      <p>Desarrollado por EAM 2026</p>
    </footer>
  </body>
</html>
