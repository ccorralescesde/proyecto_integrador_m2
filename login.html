<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novamentis - login</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="title">Novamentis</div>
        <ul class="nav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="notas.html">Notas</a></li>
          <li><a href="registro_estud.html">Registro</a></li>
        </ul>
      </nav>
    </header>

    <main class="login-container">

    <section class="form-login">
        <form action="">
            <label for="">Correo estudiante</label><br>
            <input type="mail" name="correo" id="correo" placeholder="Ingrese su correo" required><br>
            <label for="">Contraseña</label><br>
            <input type="password" name="contraseña" id="contraseña" placeholder="Ingrese su contraseña" required><br>
            <input type="checkbox" name="" id="">
            <label for="">Recordar contraseña</label>
            <button type="submit" class="btn-login">Iniciar sesión</button>
            <a href="#">Crear cuenta</a><br>
            <a href="#">Restablecer contraseña</a>
        </form>
    </section>
    <section class="img-login">
        <img class="img-login" src="img/login.png" alt="login">

    </section>
    </main>

    <footer class="footer">
      <p>&copy; 2023 Novamentis. Todos los derechos reservados.</p>
      <p>Desarrollado por EAM 2026</p>
    </footer>
  </body>
</html>
