<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novamentis - Registro</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>

    <header>
      <nav class="navbar">
        <span class="title">Novamentis</span>
        <ul class="nav">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="notas.html">Notas</a></li>
          <li><a href="registro_estud.html">Registro</a></li>
        </ul>
      </nav>
    </header>

    <main class="registro-container">
      <article class="form-registro">
        <h2>Registro de estudiante</h2>

        <form action="" method="POST">

          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre"
                 placeholder="Ingrese su nombre" required maxlength="50">

          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido"
                 placeholder="Ingrese su apellido" required maxlength="50">

          <label for="documento">Número de documento</label>
          <input type="number" id="documento" name="documento"
                 placeholder="Ingrese su número de documento" required min="1000000">

          <label for="programa">Programa a matricular</label>
          <select id="programa" name="programa" required>
            <option value="">Seleccione programa a matricular</option>
            <option value="robotica">Robótica</option>
            <option value="software">Desarrollo de Software</option>
            <option value="datos">Ciencia de Datos</option>
          </select>

          <section class="registro-botones">
            <a href="index.html" class="btn-cancelar">Cancelar</a>
            <button type="submit" class="btn-login">Guardar cambios</button>
          </section>

        </form>
      </article>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Novamentis. Todos los derechos reservados.</p>
      <p>Desarrollado por EAM 2026</p>
    </footer>

  </body>
</html>
